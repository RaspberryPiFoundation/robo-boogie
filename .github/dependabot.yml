version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release (security fixes aren't delayed).
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The frontend build (dev/package.json)
  - package-ecosystem: npm
    directory: /dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Sass 2 and 3 drop features our 2013 Sass uses (see the README)
      - dependency-name: sass
        update-types: ["version-update:semver-major"]
